services:
  postgres:
    image: postgres:16
    container_name: workergrid_postgres
    environment:
      POSTGRES_USER: workergrid
      POSTGRES_PASSWORD: workergrid
      POSTGRES_DB: workergrid
    ports:
      - "5432:5432"
    volumes:
      - workergrid_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: workergrid_redis
    ports:
      - "6379:6379"
    volumes:
      - workergrid_redis_data:/data

volumes:
  workergrid_postgres_data:
  workergrid_redis_data:
